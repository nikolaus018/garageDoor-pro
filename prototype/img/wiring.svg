</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="40" class="h1">What connects to what</text><rect x="40" y="80" width="300" height="480" rx="12" fill="#1c2b4a" stroke="#343a40" stroke-width="2"/><text x="190.0" y="110" class="cap" text-anchor="middle" style="fill:#fff">ESP32-C3 SuperMini</text><text x="190.0" y="132" class="body" text-anchor="middle" style="fill:#dee2e6">USB-C ← car charger</text><rect x="780" y="80" width="250" height="210" rx="12" fill="#5f3dc4" stroke="#343a40" stroke-width="2"/><text x="905.0" y="110" class="cap" text-anchor="middle" style="fill:#fff">GPS module</text><text x="905.0" y="132" class="body" text-anchor="middle" style="fill:#dee2e6">e.g. Beitian BE-220</text><rect x="660" y="370" width="220" height="190" rx="12" fill="#212529" stroke="#343a40" stroke-width="2"/><text x="770.0" y="400" class="cap" text-anchor="middle" style="fill:#fff">K1 AQY212EH</text><text x="770.0" y="422" class="body" text-anchor="middle" style="fill:#dee2e6">PhotoMOS relay</text><rect x="980" y="390" width="170" height="150" rx="12" fill="#495057" stroke="#343a40" stroke-width="2"/><text x="1065.0" y="420" class="cap" text-anchor="middle" style="fill:#fff">Spare remote</text><text x="1065.0" y="442" class="body" text-anchor="middle" style="fill:#dee2e6">button contacts</text><circle cx="340" cy="160" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="165" class="body" text-anchor="end" style="fill:#fff">5V</text><circle cx="340" cy="220" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="225" class="body" text-anchor="end" style="fill:#fff">GND</text><circle cx="340" cy="280" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="285" class="body" text-anchor="end" style="fill:#fff">GPIO5</text><circle cx="340" cy="340" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="345" class="body" text-anchor="end" style="fill:#fff">GPIO4</text><circle cx="340" cy="440" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="445" class="body" text-anchor="end" style="fill:#fff">GPIO7</text><text x="60" y="520" class="body" style="fill:#dee2e6">LED = GPIO8 · BOOT/SETUP = GPIO9</text><circle cx="780" cy="160" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="165" class="body" text-anchor="start" style="fill:#fff">VCC</text><circle cx="780" cy="200" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="205" class="body" text-anchor="start" style="fill:#fff">GND</text><circle cx="780" cy="240" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="245" class="body" text-anchor="start" style="fill:#fff">TX</text><circle cx="780" cy="270" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="275" class="body" text-anchor="start" style="fill:#fff">RX</text><circle cx="660" cy="420" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="674" y="425" class="body" text-anchor="start" style="fill:#fff">1 (+)</text><circle cx="660" cy="510" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="674" y="515" class="body" text-anchor="start" style="fill:#fff">2 (−)</text><circle cx="880" cy="420" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="866" y="425" class="body" text-anchor="end" style="fill:#fff">4</text><circle cx="880" cy="510" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="866" y="515" class="body" text-anchor="end" style="fill:#fff">3</text><path d="M346,160 L774,160" fill="none" stroke="#e03131" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="152" class="body" font-weight="700" style="fill:#e03131">5V</text><path d="M346,220 L720,220 L720,200 L774,200" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="212" class="body" font-weight="700" style="fill:#343a40">GND</text><path d="M346,280 L740,280 L740,240 L774,240" fill="none" stroke="#2f9e44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="272" class="body" font-weight="700" style="fill:#2f9e44">GPS TX → GPIO5</text><path d="M346,340 L755,340 L755,270 L774,270" fill="none" stroke="#1971c2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="332" class="body" font-weight="700" style="fill:#1971c2">GPIO4 → GPS RX</text><path d="M346,440 L440,440" fill="none" stroke="#f08c00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="440" y="428" width="84" height="24" rx="10" fill="#e9d5a1" stroke="#7a5c1e" stroke-width="2"/><text x="482" y="445" class="labd">R1 330Ω</text><path d="M524,440 L600,440 L600,420 L654,420" fill="none" stroke="#e8590c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M600,440 L600,462" fill="none" stroke="#e8590c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="588" y="462" width="24" height="54" rx="10" fill="#e9d5a1" stroke="#7a5c1e" stroke-width="2"/><text x="622" y="485" class="labd" text-anchor="start" font-size="12">R2</text><text x="622" y="500" class="labd" text-anchor="start" font-size="12">100k</text><path d="M600,516 L600,580 L636,580 L636,510 L654,510" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M600,580 L370,580 L370,220" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M886,420 L974,420" fill="none" stroke="#9c36b5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="920" y="408" class="body" font-weight="700" style="fill:#9c36b5">J1</text><path d="M886,510 L974,510" fill="none" stroke="#c2255c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="600" cy="440" r="7" fill="#e8590c"/><circle cx="600" cy="580" r="7" fill="#343a40"/><circle cx="370" cy="220" r="7" fill="#343a40"/><text x="1065" y="470" class="body" text-anchor="middle" style="fill:#fff">either way round</text><text x="40" y="616" class="body">Same colours as on the board pictures. K1 closes like a pressed button and stays open without power.</text></svg>