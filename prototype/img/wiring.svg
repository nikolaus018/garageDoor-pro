<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640"><style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.pcb{fill:#1e6b45}.pad{fill:#c9a65b}.hole{fill:#0e2a1d}
.axis{font-size:13px;fill:#f1f3f5;text-anchor:middle;font-weight:600}
.ghost{fill:none;stroke:#d3f0df;stroke-width:2;stroke-dasharray:6 4;opacity:.75}
.ghostt{font-size:12px;font-weight:700;fill:#d3f0df;text-anchor:middle;opacity:.9}
.cap{font-size:17px;fill:#212529;font-weight:700}
.body{font-size:15px;fill:#212529}
.mono{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#212529}
.h1{font-size:24px;font-weight:800;fill:#212529}
.lab{font-size:13px;font-weight:700;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:3px}
.labd{font-size:13px;font-weight:700;fill:#212529;text-anchor:middle}
.pinl{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:#000;stroke-width:3px}
.new{filter:drop-shadow(0 0 5px #ffd43b)}
</style><rect width="100%" height="100%" fill="#fff"/><text x="30" y="40" class="h1">What connects to what</text><rect x="40" y="80" width="300" height="480" rx="12" fill="#1c2b4a" stroke="#343a40" stroke-width="2"/><text x="190.0" y="110" class="cap" style="text-anchor:middle;fill:#fff">ESP32-C3 SuperMini</text><text x="190.0" y="132" class="body" style="text-anchor:middle;fill:#dee2e6">USB-C ← car charger</text><rect x="780" y="80" width="250" height="210" rx="12" fill="#5f3dc4" stroke="#343a40" stroke-width="2"/><text x="905.0" y="110" class="cap" style="text-anchor:middle;fill:#fff">GPS module</text><text x="905.0" y="132" class="body" style="text-anchor:middle;fill:#dee2e6">GY-GPS6MV2, 3.3 V</text><rect x="980" y="390" width="170" height="150" rx="12" fill="#495057" stroke="#343a40" stroke-width="2"/><text x="1065.0" y="420" class="cap" style="text-anchor:middle;fill:#fff">Spare remote</text><text x="1065.0" y="442" class="body" style="text-anchor:middle;fill:#dee2e6">button contacts</text><circle cx="340" cy="160" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="165" class="body" style="text-anchor:end;fill:#fff">3V3</text><circle cx="340" cy="220" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="225" class="body" style="text-anchor:end;fill:#fff">GND</text><circle cx="340" cy="280" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="285" class="body" style="text-anchor:end;fill:#fff">GPIO5</text><circle cx="340" cy="340" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="345" class="body" style="text-anchor:end;fill:#fff">GPIO4</text><circle cx="340" cy="440" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="326" y="445" class="body" style="text-anchor:end;fill:#fff">GPIO7</text><text x="60" y="520" class="body" style="fill:#dee2e6">LED = GPIO8 · BOOT/SETUP = GPIO9</text><circle cx="780" cy="160" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="165" class="body" style="text-anchor:start;fill:#fff">VCC</text><circle cx="780" cy="200" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="205" class="body" style="text-anchor:start;fill:#fff">GND</text><circle cx="780" cy="240" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="245" class="body" style="text-anchor:start;fill:#fff">TX</text><circle cx="780" cy="270" r="6" fill="#fff" stroke="#343a40" stroke-width="2"/><text x="794" y="275" class="body" style="text-anchor:start;fill:#fff">RX</text><path d="M346,160 L774,160" fill="none" stroke="#e03131" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="152" class="body" style="font-weight:700;fill:#e03131">3V3</text><path d="M346,220 L720,220 L720,200 L774,200" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="212" class="body" style="font-weight:700;fill:#343a40">GND</text><path d="M346,280 L740,280 L740,240 L774,240" fill="none" stroke="#2f9e44" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="272" class="body" style="font-weight:700;fill:#2f9e44">GPS TX → GPIO5</text><path d="M346,340 L755,340 L755,270 L774,270" fill="none" stroke="#1971c2" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="380" y="332" class="body" style="font-weight:700;fill:#1971c2">GPIO4 → GPS RX</text><path d="M346,440 L440,440" fill="none" stroke="#f08c00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M405,440 L405,458" fill="none" stroke="#f08c00" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="393" y="458" width="24" height="44" rx="10" fill="#e9d5a1" stroke="#7a5c1e" stroke-width="2"/><text x="425" y="478" class="labd" style="text-anchor:start;font-size:12px">R3</text><text x="425" y="493" class="labd" style="text-anchor:start;font-size:12px">1k</text><path d="M405,502 L405,522" fill="none" stroke="#0c8599" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M393,522 L417,522 L405,542 Z" fill="#fa5252" stroke="#a51111" stroke-width="2"/><line x1="393" y1="543" x2="417" y2="543" stroke="#a51111" stroke-width="3"/><text x="425" y="537" class="labd" style="text-anchor:start;font-size:12px">D1 red</text><path d="M405,544 L405,580" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="440" y="428" width="84" height="24" rx="10" fill="#e9d5a1" stroke="#7a5c1e" stroke-width="2"/><text x="482" y="445" class="labd">R1 330Ω</text><path d="M524,440 L712,440" fill="none" stroke="#e8590c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M600,440 L600,462" fill="none" stroke="#e8590c" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><rect x="588" y="462" width="24" height="54" rx="10" fill="#e9d5a1" stroke="#7a5c1e" stroke-width="2"/><text x="622" y="485" class="labd" style="text-anchor:start;font-size:12px">R2</text><text x="622" y="500" class="labd" style="text-anchor:start;font-size:12px">100k</text><path d="M600,516 L600,580" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M760,580 L370,580 L370,220" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><line x1="712" y1="405" x2="712" y2="475" stroke="#212529" stroke-width="5"/><line x1="712" y1="425" x2="760" y2="395" stroke="#212529" stroke-width="3"/><line x1="712" y1="455" x2="760" y2="485" stroke="#212529" stroke-width="3"/><path d="M760,485 L743,484 L751,470 Z" fill="#212529"/><text x="700" y="392" class="labd" style="text-anchor:end;font-weight:700">Q1 NPN</text><text x="700" y="410" class="labd" style="text-anchor:end;font-size:12px">2N2222, S8050, BC547…</text><text x="768" y="392" class="labd" style="text-anchor:start">C</text><text x="768" y="498" class="labd" style="text-anchor:start">E</text><text x="700" y="433" class="labd" style="text-anchor:end">B</text><path d="M760,395 L760,360 L880,360 L880,420 L974,420" fill="none" stroke="#9c36b5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="790" y="350" class="body" style="font-weight:700;fill:#9c36b5">J1 screw 1</text><path d="M760,485 L760,580" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><path d="M760,510 L974,510" fill="none" stroke="#343a40" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/><text x="790" y="500" class="body" style="font-weight:700;fill:#343a40">J1 screw 2</text><circle cx="600" cy="440" r="7" fill="#e8590c"/><circle cx="600" cy="580" r="7" fill="#343a40"/><circle cx="370" cy="220" r="7" fill="#343a40"/><circle cx="405" cy="440" r="7" fill="#f08c00"/><circle cx="405" cy="580" r="7" fill="#343a40"/><circle cx="760" cy="510" r="7" fill="#343a40"/><text x="1065" y="470" class="body" style="text-anchor:middle;fill:#fff">+ to 1, − to 2</text><text x="40" y="616" class="body">Same colours as on the board pictures. Q1 switches like a pressed button (+ side to screw 1); R2 keeps it off while the board boots.</text></svg>